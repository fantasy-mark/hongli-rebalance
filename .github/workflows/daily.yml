name: Daily Rebalance Check

# 触发方式: 由外部 cron 服务 (如 console.cron-job.org) 通过
#   POST /repos/{owner}/{repo}/actions/workflows/daily.yml/dispatches
# 调用 repository_dispatch; workflow_dispatch 仅供本地手动测试。
on:
  repository_dispatch:
    types: [trigger]
  workflow_dispatch:

permissions:
  contents: write   # 提交 data/* 回仓库

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install CJK font (Linux runner)
        # matplotlib 在 GitHub Ubuntu runner 上没有 CJK 字体,
        # 需要 fonts-noto-cjk 才能让中文字段正常显示在 PNG 中。
        run: sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Record today's snapshot
        id: record
        # record.py 同时跑 3pp + 网格, 并在末尾调用 chart.render_chart
        run: python -m src.record

      - name: Render chart (idempotent recovery)
        # record.py 的 chart 渲染是 best-effort 静默失败; 在 runner 上
        # akshare 网络不稳可能导致 PNG 没生成。单独再跑一次保证有图。
        # 本地 `python -m src.record` 已自带渲染, 这次只是幂等冗余。
        id: chart
        continue-on-error: true
        run: python -m src.chart

      - name: Verify data files
        # 调试: commit 之前看一眼 data/ 真实状态 (history / grid_state / chart 是否都在)
        run: ls -la data/

      - name: Send email digest
        # 即使 record 失败也尝试发邮件 (说明性)
        if: always()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
        run: |
          if [ "${{ steps.record.outcome }}" = "success" ]; then
            python -m src.notify
          else
            echo "::warning::record step failed; sending failure notice"
            python -m src.notify_failure
          fi

      - name: Commit data files
        if: success()
        # 直接用 git add/commit/push, 避免 git-auto-commit 的"没东西就静默跳过"行为
        # (那个行为之前让 grid_chart.png 连续 7 天没被提交, Pages 一直 404)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/grid_state.json data/grid_chart.png 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "::warning::no staged changes in data/ — chart may have failed, see ls -la output above"
          else
            git commit -m "auto: snapshot ${{ steps.record.outputs.date }}"
            git push
            echo "committed and pushed"
          fi
