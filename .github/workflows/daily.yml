name: Daily Rebalance Check

# 触发方式: 由外部 cron 服务 (如 console.cron-job.org) 通过
#   POST /repos/{owner}/{repo}/actions/workflows/daily.yml/dispatches
# 调用 repository_dispatch; workflow_dispatch 仅供本地手动测试。
on:
  repository_dispatch:
    types: [trigger]
  workflow_dispatch:

permissions:
  contents: write   # 提交 data/* 回仓库

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install CJK font (Linux runner)
        # matplotlib 在 GitHub Ubuntu runner 上没有 CJK 字体,
        # 需要 fonts-noto-cjk 才能让中文字段正常显示在 PNG 中。
        run: sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Record today's snapshot
        id: record
        # record.py 同时跑 3pp + 网格, 并在末尾调用 chart.render_chart
        run: python -m src.record

      - name: Send email digest
        # 即使 record 失败也尝试发邮件 (说明性)
        if: always()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
        run: |
          if [ "${{ steps.record.outcome }}" = "success" ]; then
            python -m src.notify
          else
            echo "::warning::record step failed; sending failure notice"
            python -m src.notify_failure
          fi

      - name: Commit data files
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'auto: snapshot ${{ steps.record.outputs.date }}'
          file_pattern: |
            data/history.json
            data/grid_state.json
            data/grid_chart.png
