name: Daily Rebalance Check

# 触发方式: 由外部 cron 服务 (如 console.cron-job.org) 通过
#   POST /repos/{owner}/{repo}/actions/workflows/daily.yml/dispatches
# 调用 repository_dispatch; workflow_dispatch 仅供本地手动测试。
on:
  repository_dispatch:
    types: [trigger]
  workflow_dispatch:

permissions:
  contents: write   # 提交 data/* 回仓库

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install CJK font (Linux runner)
        # matplotlib 在 GitHub Ubuntu runner 上没有 CJK 字体,
        # 需要 fonts-noto-cjk 才能让中文字段正常显示在 PNG 中。
        #
        # 包装而非直跑: 2026-10-23 这个步骤挂了 (apt "The operation was
        # canceled."), record 步骤因此被 skipped, 而旧版失败邮件声称
        # "失败原因: record 步骤未成功完成" —— 把排查引到了错误的步骤。
        # 现在捕获日志尾部 + 退出码, 由 notify_failure 如实上报。
        id: font
        run: |
          set +e
          sudo apt-get install -y fonts-noto-cjk > font_install.log 2>&1
          rc=$?
          tail -c 3000 font_install.log > font_install.tail.log || true
          cat font_install.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Record today's snapshot
        id: record
        # daily_snapshot 同时跑 3pp + 网格, 并在末尾调用 chart_renderer.render_chart
        #
        # 同样包装以便失败时上报真实 stderr。注意 daily_snapshot 通过
        # write_github_output() 追加 date/total/trigger 到 $GITHUB_OUTPUT,
        # 该文件经环境变量继承, 重定向 stdout 不影响它 —— 末尾的 Commit
        # 步骤仍能读到 steps.record.outputs.date。
        run: |
          set +e
          python -m src.application.daily_snapshot > record_stdout.log 2> record_stderr.log
          rc=$?
          tail -c 3000 record_stderr.log > record_stderr.tail.log || true
          cat record_stdout.log
          cat record_stderr.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Render chart (idempotent recovery)
        # daily_snapshot 的 chart 渲染是 best-effort 静默失败; 在 runner 上
        # akshare 网络不稳可能导致 PNG 没生成。单独再跑一次保证有图。
        # 本地 `python -m src.application.daily_snapshot` 已自带渲染, 这次只是幂等冗余。
        id: chart
        continue-on-error: true
        run: python -m src.infrastructure.chart_renderer

      - name: Verify data files
        # 调试: commit 之前看一眼 data/ 真实状态 (history / grid_state / chart 是否都在)
        run: ls -la data/

      - name: Commit data files
        # ⚠️ **不能**写成 `if: success()` —— 那会让**发邮件失败**顺带把
        # 当天的快照也扣住 (邮件在提交之前跑)。邮件出问题不该丢数据。
        # 提交只取决于「快照那一步有没有成」, 邮件在**之后**发。
        if: steps.record.outcome == 'success'
        # 直接用 git add/commit/push, 避免 git-auto-commit 的"没东西就静默跳过"行为
        # (那个行为之前让 grid_chart.png 连续 7 天没被提交, Pages 一直 404)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/grid_state.json data/grid_chart.png 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "::warning::no staged changes in data/ — chart may have failed, see ls -la output above"
          else
            git commit -m "auto: snapshot ${{ steps.record.outputs.date }}"
            git push
            echo "committed and pushed"
          fi

      - name: Send email digest
        # 即使 record 失败也尝试发邮件 (说明性)
        #
        # 传 steps.*.outcome 与 .outputs.rc 给 notify_failure: 它据此判断
        # 到底是哪一步失败 (record 自身失败 vs 被上游中断而 skipped), 并
        # 读取各步骤捕获的日志尾部。缺了这些, 邮件只能给出静态猜测。
        if: always()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
          # 邮件页脚的「在线查看」链接 —— 之前根本没传, 邮件里的链接是空的。
          PAGES_URL: https://fantasy-mark.github.io/hongli-rebalance
          FONT_OUTCOME:   ${{ steps.font.outcome }}
          FONT_RC:        ${{ steps.font.outputs.rc }}
          RECORD_OUTCOME: ${{ steps.record.outcome }}
          RECORD_RC:      ${{ steps.record.outputs.rc }}
        run: |
          if [ "${{ steps.record.outcome }}" = "success" ]; then
            python -m src.presentation.digest
          else
            echo "::warning::record step did not succeed (outcome=${{ steps.record.outcome }}); sending failure notice"
            python -m src.presentation.notify_failure
          fi
