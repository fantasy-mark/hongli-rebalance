name: Build & Deploy Pages

on:
  # 每天收盘后自动刷新（北京时间 08:10 ≈ UTC 00:10）
  schedule:
    - cron: "10 0 * * 1-5"
  # 允许手动触发
  workflow_dispatch:
    inputs:
      start_date:
        description: "回测起始日 (YYYY-MM-DD)，留空用默认 2020-11-05"
        required: false
        default: ""
      dpi:
        description: "策略全景图 DPI"
        required: false
        default: "150"
  # 允许 data 目录外的手动推送触发
  push:
    branches: [ddd]
    paths:
      - "pages/**"
      - "scripts/build_pages.py"
      - "src/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ddd
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build pages data (backtest + chart)
        env:
          START_DATE: ${{ github.event.inputs.start_date }}
          DPI: ${{ github.event.inputs.dpi }}
        run: |
          ARGS=""
          if [ -n "$START_DATE" ]; then ARGS="$ARGS --start $START_DATE"; fi
          if [ -n "$DPI" ]; then ARGS="$ARGS --dpi $DPI"; fi
          python scripts/build_pages.py $ARGS

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/data
          if git diff --staged --quiet; then
            echo "no data changes"
          else
            git commit -m "chore(pages): refresh site data $(date -u +%Y-%m-%d)"
            git push origin HEAD:ddd
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
