name: Refresh Pages Data

# 说明:
#   本仓库的 GitHub Pages 使用「分支部署」（Source = ddd 分支根目录 /），
#   站点入口是 ddd 分支的 index.html。
#   因此这里不需要 actions/deploy-pages —— 只要本工作流把刷新后的
#   data/site/* 提交回 ddd，GitHub 会自动重新构建 Pages。
#
#   价格缓存 data/price_cache/*.json 已入库，CI 无需访问行情接口，
#   回测可离线复现；需要最新行情时再手动触发。

on:
  # 每个交易日收盘后刷新（北京时间 08:10 ≈ UTC 00:10）
  schedule:
    - cron: "10 0 * * 2-6"
  workflow_dispatch:
    inputs:
      start_date:
        description: "回测起始日 (YYYY-MM-DD)，留空用默认 2020-11-05"
        required: false
        default: ""
      dpi:
        description: "策略全景图 DPI"
        required: false
        default: "150"

permissions:
  contents: write

concurrency:
  group: refresh-pages-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ddd
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sanity test (domain + use case)
        run: python -m pytest tests/test_pages_site.py -q

      - name: Build pages data (backtest + chart)
        env:
          START_DATE: ${{ github.event.inputs.start_date }}
          DPI: ${{ github.event.inputs.dpi }}
        run: |
          ARGS=""
          if [ -n "$START_DATE" ]; then ARGS="$ARGS --start $START_DATE"; fi
          if [ -n "$DPI" ]; then ARGS="$ARGS --dpi $DPI"; fi
          python scripts/build_pages.py $ARGS

      - name: Verify generated artifacts
        run: |
          set -e
          test -s data/site/summary.json
          test -s data/site/trades.json
          test -s data/site/grid_chart.png
          python - <<'PY'
          import json, pathlib
          s = json.loads(pathlib.Path("data/site/summary.json").read_text(encoding="utf-8"))
          assert {"combined", "rebalance", "grid"} <= set(s), s.keys()
          assert s["grid"]["total_rounds"] > 0
          assert {"grid", "rebalance"} <= set(s.get("strategies", {})), s.keys()
          t = json.loads(pathlib.Path("data/site/trades.json").read_text(encoding="utf-8"))
          assert len(t["trades"]) > 0
          # 回测交易记录同时含两个策略
          strategies = {x["strategy"] for x in t["trades"]}
          assert strategies == {"grid", "rebalance"}, strategies
          print(f"OK: {len(t['trades'])} trades ({sorted(strategies)}), "
                f"combined {s['combined']['total_return']:+.2%}")
          PY

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/site data/price_cache
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore(pages): refresh site data $(date -u +%Y-%m-%d)"
            git push origin HEAD:ddd
          fi
