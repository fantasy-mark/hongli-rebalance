name: Apply Holdings Update

# Triggered by the GitHub Pages editor — see index.html form.
# Payload: { event_type: "update_holdings",
#            client_payload: { schema: "trades-v1",
#                              trades: [{date, side, code?, shares?, price?,
#                                        amount?, note?}, ...] } }
#
# The editor posts *real trades* (8 valid sides total — buy, sell,
# deposit_rebalance, deposit_grid, withdraw_rebalance, withdraw_grid,
# transfer_to_rebalance, transfer_to_grid) rather than an absolute
# snapshot. apply_holdings.py appends to data/trades.json and rebuilds
# data/holdings.json (schema v2, two cash pools) as a derived cache.
on:
  repository_dispatch:
    types: [update_holdings]

permissions:
  contents: write   # commit data/trades.json + data/holdings.json back

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply edit
        env:
          # github.event.client_payload is always a string map; accessing
          # nested keys (${{ ... .rows }}) in expressions can confuse the
          # GH template linter, so we dump the whole payload as JSON and
          # let the python script parse it.
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          python -X utf8 scripts/apply_holdings.py "$PAYLOAD"

      - name: Verify result
        # Defensive read-back: fail loudly if the file is now invalid JSON
        # (would block the next record.py run).
        run: |
          python -c "import json; \
            t=json.load(open('data/trades.json')); \
            d=json.load(open('data/holdings.json')); \
            print('verify ok: trades=', len(t.get('trades',[])), \
                  'holdings.cash_rebalance=', d.get('cash_rebalance'), \
                  'holdings.cash_grid=', d.get('cash_grid'), \
                  'holdings.positions=', len(d.get('positions',[])))"

      - name: Commit and push
        run: |
          git config user.name  "holdings-bot[bot]"
          git config user.email "holdings-bot@users.noreply.github.com"
          if git diff --quiet data/trades.json data/holdings.json; then
            echo "no changes; skipping commit"
            exit 0
          fi
          git add data/trades.json data/holdings.json
          git commit -m "trades: user edit via Pages ($(date -u +%FT%TZ))"
          git push

      - name: Re-trigger daily record
        # Re-run record.py so the email digest & history.json reflect the
        # new grid state within ~1 minute of the edit.
        #
        # The dispatch call lives in scripts/trigger_daily.py (D12) -- the
        # two apply-*.yml workflows used to carry their own copy of the same
        # curl, and the error handling was buried in a shell `||`, so an
        # expired/missing token showed up as "nothing happened" instead of
        # a 401. The script turns it into a readable error + ::error::
        # annotation.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -X utf8 scripts/trigger_daily.py
